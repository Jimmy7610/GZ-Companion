plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    from("gamezone-pack") {
        into("gamezone-pack")
    }

    from("guide-content") {
        into("assets/gzcompanion/guides")
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

test {
    useJUnitPlatform()
}

// Client game tests (src/gametest): launch the real Minecraft client in build/run/clientGameTest and
// drive GZ Companion through real input - see src/gametest/java/.../GZCompanionClientGameTest.java.
// Run with: gradlew runClientGameTest (twice: the second run verifies data after a game restart).
// Only the integrated singleplayer server is used, so no EULA is accepted on anyone's behalf.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "gzcompanion-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = false
        clearRunDirectory = false
        username = "GZTester"
    }
}
